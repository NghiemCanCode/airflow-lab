services:
  vault:
    image: hashicorp/vault:1.15
    container_name: airflow-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root-token-lab-secret"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_TOKEN: "root-token-lab-secret"
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 3

  airflow-scheduler:
    volumes:
      - ./tests:/opt/airflow/tests 
    depends_on:
      vault:
        condition: service_healthy

  airflow-worker:
    volumes:
      - ./tests:/opt/airflow/tests
    depends_on:
      vault:
        condition: service_healthy

  airflow-apiserver:
    volumes:
      - ./tests:/opt/airflow/tests 
    depends_on:
      vault:
        condition: service_healthy